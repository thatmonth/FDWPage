<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>君の名は。</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    height: 100vh;
    overflow: hidden;
    cursor: crosshair;
    font-family: 'Hiragino Mincho Pro', 'Noto Serif JP', 'SimSun', serif;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .bg {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: url('bg.jpg') center/cover no-repeat;
    z-index: 0;
  }

  /* 暗角 */
  .vignette {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.3) 100%);
    z-index: 1;
    pointer-events: none;
  }

  /* ── 流星 ── */
  .star {
    position: absolute;
    z-index: 3;
    pointer-events: none;
    animation: shoot var(--dur) linear forwards;
    opacity: 0;
  }

  .star::before {
    content: '';
    display: block;
    width: 3px; height: 3px;
    background: white;
    border-radius: 50%;
    box-shadow: 0 0 6px 2px white;
  }

  .star::after {
    content: '';
    position: absolute;
    top: 50%; right: 3px;
    transform: translateY(-50%);
    width: var(--len);
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), white);
  }

  @keyframes shoot {
    0%   { opacity: 0; transform: translate(0,0) rotate(var(--ang)); }
    5%   { opacity: 1; }
    70%  { opacity: 0.5; }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(var(--ang)); }
  }

  /* ── 涟漪 ── */
  .ripple {
    position: absolute;
    z-index: 2;
    pointer-events: none;
    border: 1.5px solid rgba(255,255,255,0.4);
    border-radius: 50%;
    animation: rippleOut 1s ease-out forwards;
  }

  @keyframes rippleOut {
    0%   { width: 0; height: 0; opacity: 1; transform: translate(-50%,-50%); }
    100% { width: 150px; height: 150px; opacity: 0; transform: translate(-50%,-50%); }
  }

  /* ── 文字 ── */
  .title {
    position: fixed;
    bottom: 5%;
    width: 100%;
    text-align: center;
    z-index: 10;
    pointer-events: none;
  }

  .title-main {
    font-size: clamp(28px, 5vw, 50px);
    letter-spacing: 0.25em;
    color: rgba(255,255,255,0.85);
    text-shadow: 0 0 60px rgba(255,200,150,0.5), 0 2px 10px rgba(0,0,0,0.6);
  }

  .title-sub {
    font-size: clamp(12px, 2vw, 15px);
    letter-spacing: 0.4em;
    color: rgba(255,220,190,0.5);
    margin-top: 8px;
    text-shadow: 0 0 20px rgba(255,150,100,0.4);
  }

  /* ── 提示 ── */
  .hint {
    position: fixed;
    top: 5%;
    left: 5%;
    z-index: 10;
    pointer-events: none;
    color: rgba(255,255,255,0.3);
    font-size: 13px;
    letter-spacing: 0.2em;
    line-height: 2.2;
  }
</style>
</head>
<body>

<div class="bg"></div>
<div class="vignette"></div>

<div class="hint">
  黄昏時 ─ 誰そ彼<br>
  指でなぞると<br>
  星が降る
</div>

<div class="title">
  <div class="title-main">君 の 名 は 。</div>
  <div class="title-sub">─ かたわれ時 ─</div>
</div>

<script>
function createStar(x, y, angleDeg, len) {
  const star = document.createElement('div');
  star.classList.add('star');
  const rad = (angleDeg * Math.PI) / 180;
  const dist = window.innerWidth + window.innerHeight;
  star.style.left = x + 'px';
  star.style.top  = y + 'px';
  star.style.setProperty('--ang', angleDeg + 'deg');
  star.style.setProperty('--dx', Math.cos(rad) * dist + 'px');
  star.style.setProperty('--dy', Math.sin(rad) * dist + 'px');
  star.style.setProperty('--dur', (Math.random() * 0.5 + 0.4) + 's');
  star.style.setProperty('--len', (len || Math.random() * 60 + 30) + 'px');
  document.body.appendChild(star);
  setTimeout(() => star.remove(), 800);
}

// 鼠标移动
let last = 0;
document.addEventListener('mousemove', e => {
  const now = Date.now();
  if (now - last < 80) return;
  last = now;
  createStar(e.clientX + (Math.random()-0.5)*40, e.clientY + (Math.random()-0.5)*30, Math.random()*360);
});

// 点击爆发
document.addEventListener('click', e => {
  const r = document.createElement('div');
  r.classList.add('ripple');
  r.style.left = e.clientX + 'px';
  r.style.top  = e.clientY + 'px';
  document.body.appendChild(r);
  setTimeout(() => r.remove(), 1000);

  const n = 8 + Math.floor(Math.random()*10);
  for (let i = 0; i < n; i++) {
    const a = (360/n)*i + Math.random()*15;
    const rad = a * Math.PI/180;
    const d = Math.random() * 25;
    createStar(e.clientX + Math.cos(rad)*d, e.clientY + Math.sin(rad)*d, a, Math.random()*80+30);
  }
});

// 自动流星
(function loop() {
  setTimeout(loop, Math.random()*4000 + 2500);
  createStar(Math.random()*window.innerWidth, Math.random()*window.innerHeight*0.5, Math.random()*40+130, 80+Math.random()*70);
})();

// 触摸
document.addEventListener('touchmove', e => {
  e.preventDefault();
  const t = e.touches[0];
  const now = Date.now();
  if (now - last < 80) return;
  last = now;
  createStar(t.clientX + (Math.random()-0.5)*30, t.clientY + (Math.random()-0.5)*20, Math.random()*360);
}, { passive: false });

document.addEventListener('touchstart', e => {
  const t = e.touches[0];
  const n = 5 + Math.floor(Math.random()*6);
  for (let i = 0; i < n; i++) createStar(t.clientX, t.clientY, (360/n)*i, Math.random()*60+25);
});
</script>
</body>
</html>
